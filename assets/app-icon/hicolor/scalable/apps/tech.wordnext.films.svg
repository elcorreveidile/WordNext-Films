<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WordNext Films">
  <defs>
    <linearGradient id="wn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#008a4b"/>
      <stop offset="1" stop-color="#38b06a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#wn)"/>
  <!-- the film frame: a white strip with sprocket holes along its top and bottom edges -->
  <rect x="64" y="118" width="384" height="276" rx="32" fill="#ffffff"/>
  <g fill="#008a4b" opacity="0.55">
    <rect x="92" y="138" width="34" height="22" rx="7"/><rect x="150" y="138" width="34" height="22" rx="7"/>
    <rect x="208" y="138" width="34" height="22" rx="7"/><rect x="266" y="138" width="34" height="22" rx="7"/>
    <rect x="324" y="138" width="34" height="22" rx="7"/><rect x="382" y="138" width="34" height="22" rx="7"/>
    <rect x="92" y="352" width="34" height="22" rx="7"/><rect x="150" y="352" width="34" height="22" rx="7"/>
    <rect x="208" y="352" width="34" height="22" rx="7"/><rect x="266" y="352" width="34" height="22" rx="7"/>
    <rect x="324" y="352" width="34" height="22" rx="7"/><rect x="382" y="352" width="34" height="22" rx="7"/>
  </g>
  <!-- the picture area -->
  <rect x="92" y="182" width="328" height="148" rx="16" fill="#bfe5cf"/>
  <!-- the WordNext monogram, as on the other WordNext app icons -->
  <polyline points="190,214 220,300 256,244 292,300 322,214" fill="none" stroke="#008a4b" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
